name: search-ci

# Canonical gate for vidra-search: run the SAME `make ci` developers run locally
# (fmt-check + vet + migrate-lint + openapi-verify + sqlc-verify + test-race).
# Postgres/Redis are provisioned and migrations applied so the run also proves the
# schema migrates cleanly, even though `make ci`'s unit tests use in-memory fakes.
# Do not add checks here that aren't in `make ci` (ci-guard.yml enforces this).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vidra_search
          POSTGRES_PASSWORD: vidra_search
          POSTGRES_DB: vidra_search
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidra_search"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      # EXACT MANIFEST. `go mod verify` re-hashes every module in the build list
      # against go.sum, so a tampered or re-tagged dependency fails here rather
      # than compiling silently; `go mod tidy -diff` fails when go.mod/go.sum are
      # not what this source tree actually requires — the module-graph equivalent
      # of a stale lockfile. TWIN: vidra-core backend-ci.yml.
      - name: Exact module manifest (go mod verify + tidy diff)
        run: |
          go mod verify
          go mod tidy -diff

      # Pinned to the Makefile's SQLC_VERSION so `make ci`'s sqlc-verify takes the
      # fast binary path instead of compiling sqlc via `go run` each run.
      - name: Install sqlc (used by make ci's sqlc-verify)
        run: |
          curl -fsSL https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin sqlc

      # Applies the migrations EMBEDDED in the api binary (migrations/embed.go) via
      # its `migrate up` subcommand — the exact code path the published image runs
      # in production. That is why no golang-migrate CLI is downloaded here any
      # more: a separately pinned CLI could (and did) drift from the library
      # version the binary links against. The ledger table is compiled in
      # (internal/dbmigrate), so the x-migrations-table URL parameter goes with it.
      - name: Run migrations against a fresh database
        env:
          DATABASE_URL: postgres://vidra_search:vidra_search@localhost:5432/vidra_search?sslmode=disable
        run: go run ./cmd/api migrate up

      # STATIC no-silent-skip gate. `make ci` runs `go test -race ./...`
      # non-verbosely, where a skipped test prints nothing at all, so a test in
      # the DEFAULT build that self-skips on a missing env var would be part of
      # the required gate in name only. The allowlist is empty here and should
      # stay that way: the unit suite runs against in-memory fakes.
      - name: No self-skipping tests in the canonical suite
        run: bash scripts/ci/assert-no-untagged-skips.sh

      - name: Run canonical gate (make ci)
        env:
          DATABASE_URL: postgres://vidra_search:vidra_search@localhost:5432/vidra_search?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: |
          mkdir -p ci-report
          set -o pipefail
          make ci 2>&1 | tee ci-report/make-ci.log

      - name: Upload canonical gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-make-ci-log
          path: ci-report/
          retention-days: 14
          if-no-files-found: warn
