name: training-ci

# Validates the offline training pipeline (training/) on SYNTHETIC data — no real
# traffic and no database. It exercises dataset assembly → LightGBM lambdarank
# training → artifact save/load and asserts the feature-vector order still matches
# the Go server contract (internal/ranking.ModelFeatureNames). Kept separate from
# the Go gates so `make ci` stays Python-free.
on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/training-ci.yml"
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/training-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          working-directory: training
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked training environment
        run: uv sync --locked --all-extras

      # `-rs` reports every skip by name and --junitxml is the artifact. pytest
      # exits 5 when it collects nothing, so an empty suite already fails; the
      # step after fails on a suite that collected tests and skipped them, which
      # is the shape a broken optional dependency would take.
      - name: Run the training smoke test (synthetic data, no DB)
        run: |
          mkdir -p ../ci-report
          uv run --locked pytest -q -rs --junitxml=../ci-report/training-junit.xml

      - name: No silent skips in the training suite
        working-directory: ${{ github.workspace }}
        run: |
          f=ci-report/training-junit.xml
          if grep -qE 'skipped="[1-9]' "$f"; then
            echo "::error::the training suite skipped tests — a required lane must not pass by skipping:" >&2
            grep -oE '<skipped[^>]*>' "$f" >&2 || true
            exit 1
          fi
          echo "OK: training suite, 0 skipped."

      - name: Upload training test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-training-junit
          path: ci-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Prove the CLI smoke path emits a leaves-loadable artifact
        run: |
          uv run --locked python train_ranker.py --smoke --smoke-out /tmp/ranker.txt
          head -2 /tmp/ranker.txt | grep -q 'version=v3'
