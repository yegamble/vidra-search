name: training-ci

# Validates the offline training pipeline (training/) on SYNTHETIC data — no real
# traffic and no database. It exercises dataset assembly → LightGBM lambdarank
# training → artifact save/load and asserts the feature-vector order still matches
# the Go server contract (internal/ranking.ModelFeatureNames). Kept separate from
# the Go gates so `make ci` stays Python-free.
on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/training-ci.yml"
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/training-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          working-directory: training
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked training environment
        run: uv sync --locked --all-extras

      - name: Run the training smoke test (synthetic data, no DB)
        run: uv run --locked pytest -q

      - name: Prove the CLI smoke path emits a leaves-loadable artifact
        run: |
          uv run --locked python train_ranker.py --smoke --smoke-out /tmp/ranker.txt
          head -2 /tmp/ranker.txt | grep -q 'version=v3'
