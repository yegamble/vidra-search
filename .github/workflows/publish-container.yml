name: publish-container

on:
  release:
    types: [published]
  # Re-publish the image for a tag that is ALREADY released — a build that died
  # on a transient registry error, or a tag whose release predates this
  # workflow. It builds the tag, never the default branch (see "Resolve the tag
  # being published"), so it can never quietly ship main under a release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: existing vX.Y.Z tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # One source of truth for "which tag is this build?", so the two triggers
      # cannot drift: `inputs.tag` is empty on a release event and
      # `github.event.release.tag_name` is empty on a dispatch. The existence
      # check runs BEFORE the checkout so a typo'd dispatch input fails with a
      # sentence instead of a checkout error — and so this workflow only ever
      # builds a tag, never the default branch.
      - name: Resolve the tag being published
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "${TAG}" ]; then
            echo "::error::No tag to publish: neither the release payload nor the 'tag' input carried one."
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag '${TAG}' does not exist in ${GITHUB_REPOSITORY}. Push the tag (or cut the release) first — this workflow never builds the default branch."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      # The short SHA mirrors what `make build` bakes in locally (Makefile's
      # COMMIT), so GET /version reads the same whether the binary came from a
      # developer laptop or from this workflow. HEAD is the released tag because
      # the checkout above pinned `ref:` to it.
      #
      # BUILD_DATE is the tag commit's own date rather than the release's
      # published_at: it is defined for BOTH triggers, it is stable for a given
      # tag (so a re-publish still hits the gha cache and produces the same
      # image), and it is the same value whichever trigger got here. Its format
      # matches the Makefile's BUILD_DATE (UTC, %Y-%m-%dT%H:%M:%SZ) so /version
      # reads identically for a local and a released build.
      #
      # Each git command is its own statement: a command substitution inside
      # `echo` is NOT checked by `set -e`, so a failing rev-parse would have
      # shipped an image reporting commit="" (and an empty -X, i.e. "unknown").
      - name: Derive the build metadata baked into the binary
        id: buildinfo
        run: |
          set -eu
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd HEAD)"
          {
            echo "commit=${COMMIT}"
            echo "date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=sha,format=long

      - name: Build and push the released image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Injected into internal/version via -ldflags (see Dockerfile). Without
          # these the released image reports "0.1.0 / unknown / unknown" forever,
          # which makes "which build is running?" unanswerable during an
          # incident. All three derive from the resolved tag and the commit it
          # points at, so a release and a workflow_dispatch re-publish of that
          # same tag produce identical images.
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ steps.buildinfo.outputs.commit }}
            BUILD_DATE=${{ steps.buildinfo.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
