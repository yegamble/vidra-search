name: ci-guard

# CI integrity / parity monitor for vidra-search. Guards the OTHER workflows so a
# green check on GitHub means the same gate that passes locally actually ran — not
# a workflow quietly weakened to pass. Fails when:
#   1. an external action is not pinned to a full 40-character commit SHA,
#   2. a workflow hides failures with `continue-on-error: true`
#      (escape hatch: annotate the line `# ci-guard:allow` for a job the team has
#       explicitly decided is experimental),
#   3. search-ci.yml does not invoke the canonical `make ci` gate.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: External actions use immutable commit pins
        run: |
          bad=$(
            grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+' .github/workflows \
              | grep -vE 'uses:[[:space:]]+\./' \
              | grep -vE '@[0-9a-f]{40}([[:space:]]+#.*)?[[:space:]]*$' || true
          )
          if [ -n "$bad" ]; then
            echo "::error::External actions must be pinned to a full 40-character commit SHA:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "OK: every external action uses an immutable commit pin."

      - name: No hidden failures (continue-on-error)
        run: |
          bad=$(grep -rnE '^[[:space:]]*continue-on-error:[[:space:]]*true' .github/workflows \
            | grep -v 'ci-guard:allow' || true)
          if [ -n "$bad" ]; then
            echo "::error::continue-on-error: true hides failures. Remove it, or mark the line '# ci-guard:allow' if the job is intentionally experimental:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "OK: no unmarked continue-on-error."

      - name: Search CI runs the canonical gate
        run: |
          if ! grep -Eq 'make ci' .github/workflows/search-ci.yml; then
            echo "::error::search-ci.yml must run 'make ci' so CI mirrors the local gate exactly." >&2
            exit 1
          fi
          echo "OK: search-ci.yml invokes 'make ci'."
