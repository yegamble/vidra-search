name: ci-guard

# CI integrity / parity monitor for vidra-search. Guards the OTHER workflows so a
# green check on GitHub means the same gate that passes locally actually ran — not
# a workflow quietly weakened to pass. Fails when:
#   1. an external action is not pinned to a full 40-character commit SHA,
#   2. a workflow hides failures with `continue-on-error: true`
#      (escape hatch: annotate the line `# ci-guard:allow` for a job the team has
#       explicitly decided is experimental),
#   3. search-ci.yml does not invoke the canonical `make ci` gate,
#   4. .github/required-checks.txt names a job no workflow defines (a rename
#      would otherwise leave `ci-required` waiting for a check that can never
#      appear, and the failure would arrive as a timeout an hour later),
#   5. the `ci-required` fan-in (scripts/ci/require-checks.sh) passes a commit
#      its regression suite says it must not,
#   6. .github/required-checks.txt drops an entry the base branch requires
#      without a `# retired: <name> — <reason>` tombstone in the same file
#      (which is why that file is in the path filter below: it defines
#      "required", and a PR that only edits it ran no guard at all),
#   7. a script under scripts/ci does not pass `bash -n` and `shellcheck -x`.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - ".github/required-checks.txt"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - ".github/required-checks.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflow files parse the way GitHub parses them
        run: python3 scripts/ci/check-workflow-yaml.py

      # Everything under scripts/ci is what the steps below and ci-required
      # itself run, and none of it was shell-linted here: a syntax error in a
      # guard showed up as a red step, but an unquoted variable or a dropped
      # exit code showed up as nothing. `-x` follows sourced files. TWIN: the
      # same step in the other component repos; meta lints scripts/ci in
      # meta-ci's own lint loop.
      - name: scripts/ci is syntax-checked and shellchecked
        run: |
          for f in scripts/ci/*.sh; do
            bash -n "$f"
            shellcheck -x "$f"
          done

      - name: External actions use immutable commit pins
        run: |
          bad=$(
            grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+' .github/workflows \
              | grep -vE 'uses:[[:space:]]+\./' \
              | grep -vE '@[0-9a-f]{40}([[:space:]]+#.*)?[[:space:]]*$' || true
          )
          if [ -n "$bad" ]; then
            echo "::error::External actions must be pinned to a full 40-character commit SHA:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "OK: every external action uses an immutable commit pin."

      - name: No hidden failures (continue-on-error)
        run: |
          bad=$(grep -rnE '^[[:space:]]*continue-on-error:[[:space:]]*true' .github/workflows \
            | grep -v 'ci-guard:allow' || true)
          if [ -n "$bad" ]; then
            echo "::error::continue-on-error: true hides failures. Remove it, or mark the line '# ci-guard:allow' if the job is intentionally experimental:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "OK: no unmarked continue-on-error."

      - name: Every required check name is a job some workflow defines
        run: bash scripts/ci/check-required-manifest.sh

      # The file that step reads is what "required" MEANS, and it was the one
      # file no gate watched: a PR whose only change deleted a line from it ran
      # no ci-guard (the path filter did not include the file), ci-required
      # read the shortened manifest at the PR head, and the lane was gone with
      # nothing red. Now removing an entry fails unless the same file carries
      # `# retired: <name> — <reason>` for it — one reviewable diff. The guard
      # fetches the base branch's copy from origin itself (depth 1 suffices).
      # TWIN: the same two steps in the other component repos; meta runs the
      # guard in its validate job and the suite from its unit tests.
      - name: The manifest-removals guard stays fail-closed
        run: bash scripts/ci/check-required-manifest-removals_test.sh

      - name: Retiring a required lane is a deliberate, tombstoned edit
        run: bash scripts/ci/check-required-manifest-removals.sh

      # `ci-required` is the one check branch protection trusts, so every way
      # it can mis-read the API is a way to merge with a proof missing. The
      # suite drives it with a stub `gh` over raw JSON fixtures: failed and
      # partial reads, zero-job runs, duplicate check-run names. TWIN: the same
      # step in vidra-core and vidra-user; meta runs it from its unit tests.
      - name: The ci-required fan-in stays fail-closed
        run: bash scripts/ci/require-checks_test.sh

      - name: Search CI runs the canonical gate
        run: |
          if ! grep -Eq 'make ci' .github/workflows/search-ci.yml; then
            echo "::error::search-ci.yml must run 'make ci' so CI mirrors the local gate exactly." >&2
            exit 1
          fi
          echo "OK: search-ci.yml invokes 'make ci'."
