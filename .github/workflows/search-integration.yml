name: search-integration

# Integration-tagged tests (`-tags=integration`) against REAL Postgres + Redis.
# These exercise the actual sqlc SQL (search/suggest/recs correctness, event
# idempotency, reconcile orphan suppression) — coverage the fast `make ci` gate
# (unit tests against fakes) deliberately does not have. Kept SEPARATE so the
# canonical gate stays fast and runnable without a DB. Each test self-skips when
# DATABASE_URL/REDIS_URL are unset, so `make test-integration` is safe locally.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vidra_search
          POSTGRES_PASSWORD: vidra_search
          POSTGRES_DB: vidra_search
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidra_search"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      # Applies the migrations EMBEDDED in the api binary (migrations/embed.go) via
      # its `migrate up` subcommand — the exact code path the published image runs
      # in production. That is why no golang-migrate CLI is downloaded here any
      # more: a separately pinned CLI could (and did) drift from the library
      # version the binary links against. The ledger table is compiled in
      # (internal/dbmigrate), so the x-migrations-table URL parameter goes with it.
      - name: Run migrations against a fresh database
        env:
          DATABASE_URL: postgres://vidra_search:vidra_search@localhost:5432/vidra_search?sslmode=disable
        run: go run ./cmd/api migrate up

      - name: Run integration tests (make test-integration)
        env:
          DATABASE_URL: postgres://vidra_search:vidra_search@localhost:5432/vidra_search?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        # GO_TEST_FLAGS=-v so every RUN/PASS/SKIP is on the record. WITHOUT the
        # audit below this lane could pass having executed nothing: every test
        # here self-skips on an unset DATABASE_URL/REDIS_URL, so a service that
        # died after its healthcheck, or a renamed variable, leaves `go test`
        # exiting 0 with no SQL exercised at all and the check green.
        run: |
          mkdir -p ci-report
          set -o pipefail
          make test-integration GO_TEST_FLAGS=-v 2>&1 | tee ci-report/integration.log

      - name: No silent skips in the integration suite
        # Empty allowlist: this lane provides every dependency its tests need.
        run: bash scripts/ci/assert-no-silent-skips.sh ci-report/integration.log scripts/ci/allowed-skips-integration.txt

      - name: Upload integration test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-integration-log
          path: ci-report/
          retention-days: 14
          if-no-files-found: warn
