# vidra-search standalone local development stack.
#
# Deliberately uses NON-DEFAULT host ports (postgres 5433, redis 6380, api 8081)
# so it never collides with the main vidra stack (which owns 5432/6379/8080/3000).
# The service can also run against vidra-core's shared database — this compose is
# for developing vidra-search in isolation.
#
# Usage:
#   docker compose up --build            # postgres + redis + migrate + api
#   docker compose up -d postgres redis migrate   # just the deps (for `go test -tags integration`)
#                                                 # `migrate` builds the service
#                                                 # image; `make migrate-up` is
#                                                 # the no-Docker equivalent.
#
# For integration tests from the host:
#   export DATABASE_URL=postgres://vidra_search:vidra_search@localhost:5433/vidra_search?sslmode=disable
#   export REDIS_URL=redis://localhost:6380/0
#   go test -tags integration ./...

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidra_search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidra_search}
      POSTGRES_DB: ${POSTGRES_DB:-vidra_search}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # postgres:18+ images keep the cluster in a version-specific subdirectory
      # and REFUSE to start when the legacy /var/lib/postgresql/data path is a
      # mount (even an empty one). Mount the parent, as the image documents.
      #
      # This only fixes FRESH volumes. A search_postgres_data volume created by
      # postgres:16/17 still holds a pre-18 cluster and the container exits with
      # "database files are incompatible with server" / a pg_upgrade hint. Dev
      # data here is disposable, so throw the volume away and let the migrations
      # rebuild it:  make reset  (i.e. `docker compose down -v`).
      - search_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidra_search} -d ${POSTGRES_DB:-vidra_search}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot migration, run by the SERVICE image itself (the entrypoint binary's
  # `migrate up` subcommand, migrations compiled in) — the same code path a
  # production deployment uses, so this stack exercises it. No CLI image and no
  # bind-mounted migrations directory. The version ledger lands in
  # `vidra_search_migrations` (in public), never colliding with vidra-core's
  # schema_migrations when the two services share a database; the name and its
  # schema are compiled in, not URL parameters (see internal/dbmigrate).
  #
  # This service owns the stack's ONLY build; the api service below runs the same
  # image, so one build serves both. (Two build stanzas naming one tag is not the
  # way: buildx bake fails the second target with "image already exists". The
  # build lives here, not on api, because `docker compose up -d postgres redis
  # migrate` — the deps-only workflow — has to be able to build it.)
  migrate:
    image: vidra-search:dev
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vidra_search}:${POSTGRES_PASSWORD:-vidra_search}@postgres:5432/${POSTGRES_DB:-vidra_search}?sslmode=disable
    command: ["migrate", "up"]

  api:
    # Built by the migrate service above (same image, one build).
    image: vidra-search:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      VIDRA_ENV: ${VIDRA_ENV:-development}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-vidra_search}:${POSTGRES_PASSWORD:-vidra_search}@postgres:5432/${POSTGRES_DB:-vidra_search}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # Dev-only shared secret. NEVER commit a real value; a shared deployment
      # sets INTERNAL_SECRET to a strong (>=32 byte) value.
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-insecure-internal-secret-change-me-0000}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    ports:
      - "${SEARCH_HTTP_PORT:-8081}:8080"

volumes:
  search_postgres_data:
